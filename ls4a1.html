<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


</head>

<body>
    <div class="container">

        <h1 class="mb-1">My Phone Contact</h1>
        <p class="text-muted mb-4">
            Introduction to Objects in JavaScript — Grade 4–6
        </p>

        <!-- Contact Card -->
        <div class="card shadow-sm mb-3" style="max-width:400px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#FF5A43;">Contact Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-label d-block" >Name</span>
                        <strong id="name">—</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Phone</span>
                        <strong id="phone">—</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">School</span>
                        <strong id="school">—</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">City</span>
                        <strong id="city">—</strong>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Code Box -->
        <div class="card shadow-sm" style="max-width:400px;">
            <div class="card-body">
                <h6 style="color:#FF5A43;">JavaScript Object Used</h6>
                <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
        </div>

    </div><!-- /container -->


    <script>
        let myContact = {
            name: "Nandini",
            school: "school1",
            phone: "1234432",
            city: "mumbai"
        }

    let NameEl = document.getElementById("name")
    let PhoneEl = document.getElementById("phone")

    NameEl.textContent = myContact.name
    PhoneEl.textContent = myContact.phone

     let El = document.getElementById("name")
    let PhoneEl = document.getElementById("phone")
    </script>
</body>

</html>
