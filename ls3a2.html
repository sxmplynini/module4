<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> JS For Loops</h2>
    <p id="demo"></p>

    <script >
        let fruits = [
        "apple", "banana", "orange" 
        ]
        let text = ""

        for (let i = 0 ; i<fruits.length ; i++) {
            text += fruits[i] + "<br>"
            

        }

        document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
